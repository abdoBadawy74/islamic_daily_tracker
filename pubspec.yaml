name: islamic_daily_tracker
description: "تطبيق متابعة العبادات اليومية - Islamic Daily Worship Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  percent_indicator: ^4.2.5
  fl_chart: ^0.70.2

  # Date & Time
  intl: ^0.20.3
  hijri: ^3.0.0

  # Utilities
  uuid: ^4.5.1
  collection: ^1.19.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/data/
